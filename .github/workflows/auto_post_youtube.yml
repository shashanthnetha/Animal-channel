name: Auto Post Animal & Nature Shorts to YouTube

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom topic override (leave blank to auto-generate from 10 pillars)'
        required: false
        default: ''
        type: string
      privacy_status:
        description: 'YouTube Video Privacy Status'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: 'Dry run only (generate topic, script & metadata without rendering/upload)'
        required: false
        default: false
        type: boolean

concurrency:
  group: youtube-animal-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-post:
    name: Generate & Post Animal Short
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # YouTube Data API v3 OAuth Credentials
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      # Stock Video Keys (At least one required for video downloads)
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      # LLM Providers (Configure at least one in GitHub Secrets)
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'groq' }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME || 'qwen/qwen3.8-27b' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-color-emoji
          ffmpeg -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync --frozen --python 3.11

      - name: Run Autonomous Animal Shorts Pipeline
        run: |
          CMD=("uv" "run" "--no-sync" "python" "scripts/auto_animal_shorts.py")

          CUSTOM_TOPIC="${{ github.event.inputs.custom_topic }}"
          if [ -n "$CUSTOM_TOPIC" ]; then
            CMD+=("--topic" "$CUSTOM_TOPIC")
          fi

          PRIVACY_SETTING="${{ github.event.inputs.privacy_status }}"
          if [ -z "$PRIVACY_SETTING" ]; then
            PRIVACY_SETTING="public"
          fi
          CMD+=("--privacy" "$PRIVACY_SETTING")

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD+=("--dry-run")
          fi

          "${CMD[@]}"

      - name: Commit & Push Upload History
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore(history): update uploaded shorts log [skip ci]"
            git push origin main
          fi
